<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La bille et le trou</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #14202e; color: #fff; font-family: system-ui, sans-serif;
    overflow: hidden; touch-action: none; user-select: none;
  }
  canvas { display: block; }
  #score {
    position: fixed; top: 20px; width: 100%;
    text-align: center; font-size: 22px; pointer-events: none;
  }
  #ecran {
    position: fixed; inset: 0; background: rgba(10, 16, 24, .85);
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 30px; text-align: center;
  }
  button {
    font-size: 20px; padding: 14px 36px; border: 0; border-radius: 30px;
    background: #ffb330; color: #14202e; font-weight: bold;
  }
</style>
</head>
<body>

<canvas id="jeu"></canvas>
<div id="score"></div>

<div id="ecran">
  <h1 id="titre">La bille et le trou</h1>
  <p id="message">Tiens ton téléphone à plat, puis incline-le pour que la bille ne tombe pas dans le trou.</p>
  <button id="bouton">Jouer</button>
</div>

<script>
// ---------- RÉGLAGES (à modifier pour changer la difficulté) ----------
const FORCE_INCLINAISON = 40;   // réaction de la bille au téléphone
const ATTRACTION_TROU   = 90;   // pente de la table vers le centre
const SECOUSSES         = 120;  // poussées au hasard
const FROTTEMENT        = 0.985;

const canvas = document.getElementById('jeu');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const ecran = document.getElementById('ecran');
const titre = document.getElementById('titre');
const message = document.getElementById('message');
const bouton = document.getElementById('bouton');

let L, H, cx, cy, R, rTrou, rBille;
let bille, enJeu = false, temps = 0, dernier = 0, record = 0;
let incl = { x: 0, y: 0 };       // inclinaison actuelle
let zero = null;                 // position de départ du téléphone
let secousse = { x: 0, y: 0, t: 0 };

try { record = Number(localStorage.getItem('record-bille')) || 0; } catch (e) {}

function redimensionner() {
  const d = window.devicePixelRatio || 1;
  L = innerWidth; H = innerHeight;
  canvas.width = L * d; canvas.height = H * d;
  canvas.style.width = L + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(d, 0, 0, d, 0, 0);
  cx = L / 2; cy = H / 2;
  R = Math.min(L, H) * 0.45;
  rTrou = R * 0.17;
  rBille = R * 0.08;
}
addEventListener('resize', redimensionner);
redimensionner();

// ---------- GYROSCOPE ----------
function orientation(e) {
  if (e.beta === null || e.gamma === null) return;
  // adapte les axes si l'écran est tourné
  const angle = (screen.orientation && screen.orientation.angle) || 0;
  let x = e.gamma, y = e.beta;
  if (angle === 90)  { x = e.beta;   y = -e.gamma; }
  if (angle === 270) { x = -e.beta;  y = e.gamma; }
  if (angle === 180) { x = -e.gamma; y = -e.beta; }
  if (!zero) zero = { x, y };
  const limite = v => Math.max(-30, Math.min(30, v));
  incl.x = limite(x - zero.x);
  incl.y = limite(y - zero.y);
}

// ---------- PARTIE ----------
async function demarrer() {
  // iPhone : il faut demander l'autorisation
  if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
    try { await DeviceOrientationEvent.requestPermission(); } catch (e) {}
  }
  addEventListener('deviceorientation', orientation);
  zero = null;
  incl = { x: 0, y: 0 };
  const a = Math.random() * Math.PI * 2;
  bille = { x: Math.cos(a) * R * 0.6, y: Math.sin(a) * R * 0.6, vx: 0, vy: 0, taille: 1 };
  temps = 0;
  secousse = { x: 0, y: 0, t: 1.5 };
  ecran.style.display = 'none';
  enJeu = false;

  // on attend le capteur avant de lancer la partie
  setTimeout(() => {
    if (zero) { enJeu = true; return; }
    bille = null;
    titre.textContent = 'Capteur introuvable';
    message.textContent = 'Ouvre le jeu avec une adresse https dans Chrome ou Safari, et autorise les capteurs de mouvement.';
    bouton.textContent = 'Réessayer';
    ecran.style.display = 'flex';
  }, 1000);
}
bouton.onclick = demarrer;

function perdu() {
  enJeu = false;
  if (temps > record) {
    record = temps;
    try { localStorage.setItem('record-bille', record); } catch (e) {}
  }
  setTimeout(() => {
    titre.textContent = 'Tombée !';
    message.textContent = 'Tu as tenu ' + temps.toFixed(1) + ' s. Record : ' + record.toFixed(1) + ' s';
    bouton.textContent = 'Rejouer';
    ecran.style.display = 'flex';
  }, 600);
}

function avancer(dt) {
  if (!bille) return;
  if (!enJeu) {
    if (temps === 0) return;          // attente du capteur
                                      // animation de chute
    bille.x *= 0.85; bille.y *= 0.85;
    bille.taille *= 0.92;
    return;
  }
  temps += dt;
  const niveau = 1 + temps / 30;      // de plus en plus dur

  secousse.t -= dt;
  if (secousse.t <= 0) {
    const a = Math.random() * Math.PI * 2;
    secousse = { x: Math.cos(a), y: Math.sin(a), t: 1 + Math.random() };
  }

  const d = Math.hypot(bille.x, bille.y) || 1;
  const k = R / 160;                  // adapte à la taille de l'écran
  bille.vx += (incl.x * FORCE_INCLINAISON - bille.x / d * ATTRACTION_TROU * niveau + secousse.x * SECOUSSES * niveau) * k * dt;
  bille.vy += (incl.y * FORCE_INCLINAISON - bille.y / d * ATTRACTION_TROU * niveau + secousse.y * SECOUSSES * niveau) * k * dt;

  const f = Math.pow(FROTTEMENT, dt * 60);
  bille.vx *= f; bille.vy *= f;
  bille.x += bille.vx * dt;
  bille.y += bille.vy * dt;

  // rebond sur le bord de la table
  const dist = Math.hypot(bille.x, bille.y);
  const max = R - rBille;
  if (dist > max) {
    const nx = bille.x / dist, ny = bille.y / dist;
    bille.x = nx * max; bille.y = ny * max;
    const v = bille.vx * nx + bille.vy * ny;
    if (v > 0) { bille.vx -= 1.6 * v * nx; bille.vy -= 1.6 * v * ny; }
  }

  // chute dans le trou
  if (dist < rTrou) perdu();
}

// ---------- DESSIN ----------
function disque(x, y, r, couleur) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = couleur;
  ctx.fill();
}

function dessiner() {
  ctx.clearRect(0, 0, L, H);

  // table
  disque(cx, cy + 10, R + 12, 'rgba(0,0,0,.35)');
  disque(cx, cy, R + 12, '#6b3f1d');
  const bois = ctx.createRadialGradient(cx, cy, rTrou, cx, cy, R);
  bois.addColorStop(0, '#a86b32');
  bois.addColorStop(1, '#e0a763');
  disque(cx, cy, R, bois);

  // trou
  disque(cx, cy, rTrou, '#050505');

  // bille
  if (bille) {
    const x = cx + bille.x, y = cy + bille.y, r = rBille * bille.taille;
    const metal = ctx.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r + .1);
    metal.addColorStop(0, '#ffffff');
    metal.addColorStop(1, '#56606b');
    disque(x, y, r, metal);
  }

  scoreEl.textContent = '⏱ ' + temps.toFixed(1) + ' s   🏆 ' + record.toFixed(1) + ' s';
}

function boucle(t) {
  const dt = Math.min((t - dernier) / 1000, 0.033);
  dernier = t;
  avancer(dt);
  dessiner();
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);
</script>
</body>
</html>
